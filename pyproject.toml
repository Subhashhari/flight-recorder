[project]
name = "flightrec"
version = "0.1.0"
description = "Flight Recorder: tracing, deterministic replay/branching, chaos testing and evaluation for a 5-agent Google ADK pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-adk>=2.15.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.4",
    "reportlab>=5.1.0",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "tabulate>=0.10.0",
    "typer>=0.29.2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flightrec = "flightrec.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Postgres and/or a real Gemini API key"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E731", "UP042"]
